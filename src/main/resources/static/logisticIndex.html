<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отдел логистики</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/scriptindex.js" defer></script>
</head>
<body>
<div class="container">
    <h1>Отдел логистики</h1>
    <div class="section-card" aria-labelledby="section-title-applications">
        <h2 id="section-title-applications" class="section-title">Активные Заявки</h2>
        <div class="section-content" aria-describedby="section-title-applications">
            <table id="ordersTable" class="orders-table">
                <thead>
                <tr>
                    <th>Номер заявки</th>
                    <th>Дата создания</th>
                    <th>Менеджер</th>
                    <th>Статус</th>
                    <th>Статус ответа логистов</th>
                </tr>
                </thead>
                <tbody>
                <!-- Строки будут добавлены JS -->
                </tbody>
            </table>
            <p id="loadingMessage">Загружаются активные заявки...</p>
        </div>
    </div>

    <div class="section-card" aria-labelledby="section-title-applications">
        <h2 id="section-title-questions" class="section-title">Активные Запросы</h2>
        <div class="section-content" aria-describedby="section-title-applications">
            <table id="questionsTable" class="orders-table">
                <thead>
                <tr>
                    <th>Номер заявки</th>
                    <th>Дата создания</th>
                    <th>Менеджер</th>
                    <th>Статус</th>
                    <th>Статус ответа логистов</th>
                </tr>
                </thead>
                <tbody>
                <!-- Строки будут добавлены JS -->
                </tbody>
            </table>
            <p id="loadingMessageQuestions">Загружаются активные запросы...</p>
        </div>
    </div>
</div>
</body>
</html>
